# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# Allocate 2GB heap to the Gradle daemon to avoid GC thrashing during AGP/Compose builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Enable AndroidX (required by AGP 8.x).
android.useAndroidX=true

# Cache build outputs across sessions for faster incremental builds.
org.gradle.caching=true

# Run independent project tasks in parallel.
org.gradle.parallel=true

# Kotlin code style for Android projects (used by some IDE integrations).
kotlin.code.style=official

# Only generate per-module R classes (faster + smaller) — Android-recommended default.
android.nonTransitiveRClass=true
