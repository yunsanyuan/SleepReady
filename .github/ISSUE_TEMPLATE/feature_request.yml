name: 功能建议
description: 新能力、交互改进、文档补充
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认建议仍然符合项目原则：**单机离线、就地控制、国产 ROM 友好**。
        需要联网、账号或云同步的想法，大概率不会被接受。
  - type: dropdown
    id: module
    attributes:
      label: 所属板块
      options:
        - 印记（日程）
        - 心动（探索）
        - 入梦（定时）
        - 时光（记录）
        - 拾句（古诗）
        - 设置 / 备份
        - 全局 / 主题 / 无障碍
        - 文档 / 工程
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你现在怎么绕过？谁会用到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 交互、数据存在哪、要不要新权限。能保持离线最好。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其它做法
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 不需要 INTERNET 或任何云服务
          required: true
        - label: 不需要把用户数据默认传到设备外
          required: true
