name: 缺陷报告
description: 功能不符合预期、崩溃、提醒不准时等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先翻一下 [README 常见问题](../../README.md#常见问题) 和 [CHANGELOG](../../CHANGELOG.md)。
        涉及日程不响时，请先走完印记页顶部的权限引导卡片。
  - type: dropdown
    id: module
    attributes:
      label: 所属板块
      options:
        - 印记（日程）
        - 心动（探索）
        - 入梦（定时）
        - 时光（记录）
        - 拾句（古诗）
        - 设置 / 备份
        - 权限 / 提醒 / ROM
        - 构建 / 其它
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: versionName / versionCode，或 commit hash
      placeholder: "1.0 / 1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 品牌、型号、Android 版本、是否为国产 ROM（小米 / 华为 / OPPO / vivo 等）
      placeholder: "Pixel 7 · Android 14  或  小米 14 · HyperOS · Android 14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开印记
        2. 新建一条 1 分钟后的日程并开启闹钟强提醒
        3. 等待到点
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 崩溃请附 logcat 关键堆栈；提醒失效请说明通知 / 精确闹钟 / 自启动是否已授权。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 截图、录屏、是否可稳定复现、是否做过备份恢复。请不要粘贴时光正文、照片或完整备份。
